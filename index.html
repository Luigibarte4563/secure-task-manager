<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Secure Dynamic Task Manager</h1>
        </header>
        
        <section class="input-section">
            <label for="taskInput" class="visually-hidden">Enter a task</label>
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button id="addTaskBtn" type="button">Add Task</button>
            <button id="loadSamplesBtn" type="button">Load Sample Tasks</button>
        </section>
        
        <p id="taskMessage" class="error-message" aria-live="polite"></p>
        
        <section class="task-section">
            <ul id="taskList" class="task-list"></ul>
        </section>
        
        <section class="summary-section" aria-label="Task Summary">
            <div class="summary-item">
                <span class="summary-label">Total Tasks:</span>
                <span id="totalCount" class="summary-value">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Pending:</span>
                <span id="pendingCount" class="summary-value">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Completed:</span>
                <span id="completedCount" class="summary-value">0</span>
            </div>
        </section>
    </main>
    
    <script src="js/app.js"></script>
</body>
</html>
